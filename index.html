<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orario Lezioni</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f3f3f3">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

<style>
    :root {
        --accent-color: #0078d4;
        --bg-app: #f3f3f3;
        --bg-surface: rgba(255, 255, 255, 0.85);
        --bg-header: #ffffff;
        --border-color: #e5e5e5;
        --text-primary: #1a1a1a;
        --text-secondary: #5f5f5f;
        
        --tag-aula-bg: #e6f2ff;
        --tag-aula-text: #004578;
        --tag-prof-bg: #fff4ce;
        --tag-prof-text: #7d6300;
        
        --shadow-card: 0 2px 4px rgba(0,0,0,0.04);
    }

    body.dark {
        --bg-app: #202020;
        --bg-surface: rgba(45, 45, 45, 0.7);
        --bg-header: #2c2c2c;
        --border-color: #3e3e3e;
        --text-primary: #ffffff;
        --text-secondary: #a0a0a0;
        
        --tag-aula-bg: #3a4d5e;
        --tag-aula-text: #96c8fa;
        --tag-prof-bg: #4d4628;
        --tag-prof-text: #fce100;
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
        background-color: var(--bg-app);
        color: var(--text-primary);
        margin: 0;
        padding: 20px;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: background 0.3s;
        user-select: none;
    }

    /* Header */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding: 0 5px;
        flex-shrink: 0;
        app-region: drag; 
        -webkit-app-region: drag;
    }

    .controls, h1 { -webkit-app-region: no-drag; }

    .title-group h1 { margin: 0; font-size: 22px; font-weight: 600; }

    .controls { display: flex; align-items: center; gap: 8px; }

    .btn {
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        backdrop-filter: blur(10px);
        transition: all 0.2s;
        display: flex; align-items: center; gap: 5px;
    }
    .btn:hover { background: var(--border-color); }

    .color-wrapper {
        display: flex; align-items: center; background: var(--bg-surface);
        border: 1px solid var(--border-color); border-radius: 6px; padding: 2px 6px;
    }
    input[type="color"] { border: none; width: 24px; height: 24px; cursor: pointer; background: none; padding: 0; margin-right: 5px; }
    input.hex-input { border: none; background: transparent; color: var(--text-primary); font-family: monospace; text-transform: uppercase; width: 65px; font-size: 12px; outline: none; }

    /* Griglia */
    .grid-container {
        flex: 1;
        overflow: auto;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        position: relative;
    }

    .schedule-grid {
        display: grid;
        grid-template-columns: 140px repeat(3, 1fr) 40px repeat(3, 1fr); 
        min-width: 1100px; 
    }

    .grid-header {
        background: var(--bg-header); position: sticky; top: 0; z-index: 10;
        border-bottom: 1px solid var(--border-color); font-weight: 600;
        color: var(--text-secondary); padding: 10px; text-align: center; font-size: 12px; letter-spacing: 0.5px;
    }

    .day-row-label {
        background: var(--bg-header); border-right: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color); padding: 10px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-weight: 700; color: var(--accent-color); position: sticky; left: 0; z-index: 5;
    }

    .hour-toggle {
        margin-top: 5px; font-size: 10px; background: var(--bg-app);
        border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; display: flex; cursor: pointer;
    }
    .hour-toggle span { padding: 2px 8px; color: var(--text-secondary); transition: 0.2s; }
    .hour-toggle span.active { background: var(--accent-color); color: white; }
